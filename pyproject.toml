[project]
name = "llm-serving-stack"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "ray[llm,serve]==2.59.0",
]

[tool.uv]
# opencv-python-headless 5.0.0.93 ships an invalid wheel (missing Name metadata).
override-dependencies = ["opencv-python-headless<5"]
